# Private local file. Replace every example value before use. No database is
# created by the installer; provision a dedicated database/role separately.
[muit_receiver]
host=receiver-db.invalid
port=5432
dbname=muit_feed
user=muit_receiver
sslmode=verify-full
sslrootcert=/etc/muit/receiver/tls/postgres-ca.pem
# Use passfile=/etc/muit/receiver/pgpass (0600, readable by service user).
# Avoid putting passwords in command arguments or published configuration.
